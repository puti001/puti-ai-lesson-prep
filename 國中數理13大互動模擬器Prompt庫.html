        desc: "可自訂直角邊 a 與 b 長度，拖曳面積轉換進度條（0%~100%），以幾何切割圖形平滑移動與旋轉，直觀證明 a² + b² = c²。",
        features: "⚡ 核心亮點：直角三角形三邊正方形、面積切割旋轉拼圖動畫、平方和數值直觀證明",
        promptText: "請用 HTML5 + CSS + JavaScript 幫我生成一個單一檔案免安裝可直接運行的「畢氏定理幾何視覺化證明」互動教學小工具：\n1. 【控制面板】：直角邊 a 長度滑桿（3~10）、直角邊 b 長度滑桿（3~10），以及面積轉換進度滑桿（0% ~ 100%）。\n2. 【動態呈現】：\n   - 畫面中央繪製一個直角三角形，並分別在其三條邊外側建立正方形 a²、b² 與 c²。\n   - 當拖曳轉換進度條時，正方形 a² 與 b² 會以幾何切割圖形的形式平滑移動與旋轉，組合填滿斜邊上的正方形 c²。\n3. 【數值展示】：即時計算兩股平方和 a² + b² 以及斜邊平方 c² 的數值，直觀證明畢氏定理（勾股定理）。"
      }
    ];

    // 全局狀態
    let currentIndex = 0;
    let filteredSims = [...simData];
    let currentCategory = 'all';
    let isFlipped = false;
    let viewMode = 'presentation';
    let soundEnabled = true;
    let audioCtx = null;

    // 健全強大的 Web Audio API 聲音引擎
    function initAudio() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) audioCtx = new AudioClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    ['click', 'pointerdown', 'keydown', 'touchstart'].forEach(evt => {
      window.addEventListener(evt, initAudio, { once: true });
    });

    function playSfx(type) {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;

        if (type === 'hover') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(580, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.05);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.05);
        } 
        else if (type === 'flip') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(920, now + 0.09);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.09);
        }
        else if (type === 'slide') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        }
        else if (type === 'copy') {
          const osc1 = audioCtx.createOscillator();
          const osc2 = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc1.type = 'sine';
          osc2.type = 'sine';
          osc1.frequency.setValueAtTime(659.25, now);
          osc2.frequency.setValueAtTime(987.77, now + 0.08);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(audioCtx.destination);
          osc1.start(now);
          osc1.stop(now + 0.08);
          osc2.start(now + 0.08);
          osc2.stop(now + 0.3);
        }
      } catch (e) {}
    }

    function triggerHaptic(type = 'light') {
      if ('vibrate' in navigator) {
        try {
          if (type === 'light') navigator.vibrate(20);
          else if (type === 'success') navigator.vibrate([25, 45, 25]);
        } catch (e) {}
      }
    }

    // 渲染中央 Canva 主舞台卡片
    function renderMainStage() {
      if (filteredSims.length === 0) return;
      const sim = filteredSims[currentIndex];
      if (!sim) return;

      document.getElementById('currentSlideNum').innerText = sim.id < 10 ? '0' + sim.id : sim.id;
      document.getElementById('totalSlideNum').innerText = simData.length;

      // 正面內容渲染：超大字體 ＋ 領域標籤 ＋ 模擬亮點
      const frontEl = document.getElementById('stageFront');
      frontEl.innerHTML = `
        <div class="h-full flex flex-col justify-between">
          <!-- 頂部區 -->
          <div>
            <div class="flex items-center justify-between gap-2 mb-4">
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-500/10 to-indigo-500/20 dark:bg-slate-800 flex items-center justify-center text-slate-800 dark:text-slate-100 shadow-md border border-slate-200 dark:border-slate-700 text-2xl">
                  ${sim.emoji}
                </div>
                <div>
                  <span class="px-3.5 py-1 text-xs sm:text-sm font-black rounded-lg border bg-emerald-50 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800">
                    ${sim.categoryName} #${sim.id < 10 ? '0' + sim.id : sim.id}
                  </span>
                  <span class="text-xs text-slate-400 font-bold ml-2 hidden sm:inline">考點：${sim.tag}</span>
                </div>
              </div>
              <div class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-emerald-50 dark:bg-slate-800 text-emerald-700 dark:text-emerald-300 text-xs sm:text-sm font-black border border-emerald-200 dark:border-slate-700 shadow-sm">
                <i data-lucide="rotate-cw" class="w-4 h-4 text-emerald-600"></i>
                <span>點擊翻轉看 Prompt</span>
              </div>
            </div>

            <!-- 超大標題與動態呈現說明 -->
            <div class="space-y-4 pt-2">
              <div class="inline-flex items-center gap-1.5 text-xs sm:text-sm font-black text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/70 px-3 py-1 rounded-lg border border-emerald-200 dark:border-emerald-800/50">
                <i data-lucide="sparkles" class="w-4 h-4 text-emerald-500"></i>
                <span>HTML5 免安裝互動模擬小工具</span>
              </div>

              <!-- 超大標題 (2xl ~ 4xl) -->
              <h2 class="text-2xl sm:text-3xl lg:text-4xl font-black text-slate-900 dark:text-white leading-tight tracking-tight">
                ${sim.title}
              </h2>

              <!-- 詳述 (text-base ~ text-lg 大字) -->
              <p class="text-base sm:text-lg lg:text-xl text-slate-600 dark:text-slate-300 leading-relaxed font-normal pt-2">
                ${sim.desc}
              </p>
            </div>
          </div>

          <!-- 底部功能亮點與引導 -->
          <div class="pt-4 mt-3 border-t border-slate-200/90 dark:border-slate-800 space-y-3">
            <div class="text-xs sm:text-sm lg:text-base font-bold text-emerald-900 dark:text-emerald-300 bg-emerald-50 dark:bg-emerald-950/60 px-4 py-3 rounded-2xl border border-emerald-200 dark:border-emerald-800/60 flex items-center gap-2.5">
              <span class="text-xl">💡</span>
              <span class="truncate font-black">${sim.features}</span>
            </div>

            <div class="flex items-center justify-between text-xs sm:text-sm lg:text-base pt-1">
              <span class="text-slate-500 dark:text-slate-400 font-bold">適用工具：Google Gemini / Canvas</span>
              <span class="font-black text-emerald-600 dark:text-emerald-400 flex items-center gap-1.5 group-hover:translate-x-1 transition text-sm sm:text-base">
                點擊翻轉查看完整 Prompt 指令 ➔
              </span>
            </div>
          </div>
        </div>
      `;

      // 背面內容渲染：Prompt 框 ＋ 一鍵複製 ＋ 直達 Gemini
      const backEl = document.getElementById('stageBack');
      backEl.innerHTML = `
        <div class="h-full flex flex-col justify-between">
          <div>
            <!-- 背面頂部 -->
            <div class="flex items-center justify-between gap-2 pb-2.5 border-b border-slate-800">
              <div class="flex items-center gap-2">
                <span class="text-xl">${sim.emoji}</span>
                <span class="px-3 py-1 text-xs sm:text-sm font-black rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-400/40 uppercase tracking-wider">
                  ${sim.categoryName} ｜ ${sim.tag}
                </span>
              </div>
              <button onclick="toggleSlideFlip(event)" class="p-1.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition">
                <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
              </button>
            </div>

            <!-- 提示說明 -->
            <div class="py-2">
              <p class="text-xs sm:text-sm text-emerald-200 leading-relaxed font-semibold bg-emerald-950/80 p-3 rounded-2xl border border-emerald-800/60 shadow-inner">
                ✨ 將以下提示詞複製貼給 Google Gemini，即可 10 秒生成免安裝、可在瀏覽器直接玩的 HTML5 互動模擬器！
              </p>
            </div>
          </div>

          <!-- Prompt 框 (大字體、高對比) -->
          <div class="relative flex-1 my-1.5 bg-slate-950/90 rounded-2xl p-4 border border-slate-800 overflow-y-auto max-h-[220px] text-xs sm:text-sm font-mono text-slate-200 leading-relaxed selection:bg-emerald-600 shadow-inner">
            <pre id="stage_prompt_text" class="whitespace-pre-wrap">${sim.promptText}</pre>
          </div>

          <!-- 底部按鈕群：複製 ＋ 直達 Gemini -->
          <div class="pt-3 border-t border-slate-800 flex flex-wrap items-center justify-between gap-3">
            <span class="text-xs text-slate-400 font-medium hidden sm:inline">複製後至 Gemini 貼上即自動編程運行</span>
            <div class="flex items-center gap-2.5 w-full sm:w-auto">
              <button onclick="copyStagePrompt()" onmouseenter="playSfx('hover')" class="flex-1 sm:flex-initial px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-750 text-slate-200 border border-slate-700 font-bold text-xs sm:text-sm flex items-center justify-center gap-2 shadow transition active:scale-95">
                <i data-lucide="copy" class="w-4 h-4 text-emerald-400"></i>
                <span>一鍵複製 Prompt</span>
              </button>
              <button onclick="openInGemini()" onmouseenter="playSfx('hover')" class="flex-1 sm:flex-initial px-5 py-2.5 rounded-xl bg-gradient-to-r from-emerald-600 via-teal-600 to-indigo-600 hover:from-emerald-500 hover:to-indigo-500 text-white font-black text-xs sm:text-sm flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/40 active:scale-95 transition">
                <i data-lucide="external-link" class="w-4 h-4 text-amber-300"></i>
                <span>🚀 直達 Gemini 實測生成</span>
              </button>
            </div>
          </div>
        </div>
      `;

      lucide.createIcons();
      updateThumbnailSelection();
    }

    // 複製主舞台 Prompt
    function copyStagePrompt() {
      const text = document.getElementById('stage_prompt_text').innerText;
      navigator.clipboard.writeText(text).then(() => {
        playSfx('copy');
        triggerHaptic('success');
        showToast('已複製模擬器提示詞！可直接至 Gemini 貼上執行');
      });
    }

    // 自動複製並在新分頁打開 Gemini
    function openInGemini() {
      const text = document.getElementById('stage_prompt_text').innerText;
      navigator.clipboard.writeText(text).then(() => {
        playSfx('copy');
        triggerHaptic('success');
        showToast('已複製提示詞！正在為您開啟 Gemini...');
        setTimeout(() => {
          window.open('https://gemini.google.com/', '_blank');
        }, 300);
      });
    }

    // 主舞台卡片翻轉
    function toggleSlideFlip(event) {
      if (event) event.stopPropagation();
      const innerCard = document.getElementById('slideCardInner');
      isFlipped = !isFlipped;
      if (isFlipped) {
        innerCard.classList.add('slide-card-flipped');
      } else {
        innerCard.classList.remove('slide-card-flipped');
      }
      playSfx('flip');
      triggerHaptic('light');
    }

    // 下一張簡報
    function nextSlide() {
      if (currentIndex < filteredSims.length - 1) {
        currentIndex++;
        isFlipped = false;
        document.getElementById('slideCardInner').classList.remove('slide-card-flipped');
        playSfx('slide');
        triggerHaptic('light');
        renderMainStage();
      }
    }

    // 上一張簡報
    function prevSlide() {
      if (currentIndex > 0) {
        currentIndex--;
        isFlipped = false;
        document.getElementById('slideCardInner').classList.remove('slide-card-flipped');
        playSfx('slide');
        triggerHaptic('light');
        renderMainStage();
      }
    }

    // 渲染底部 Canva 風格縮圖列
    function renderThumbnails() {
      const strip = document.getElementById('thumbnailStrip');
      strip.innerHTML = '';

      filteredSims.forEach((sim, idx) => {
        const thumb = document.createElement('div');
        thumb.className = `thumbnail-item shrink-0 w-44 sm:w-52 p-2.5 rounded-2xl border-2 cursor-pointer transition-all duration-200 ${idx === currentIndex ? 'border-emerald-600 bg-emerald-50/90 dark:bg-emerald-950/60 shadow-md scale-[1.02]' : 'border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 opacity-75 hover:opacity-100 hover:border-slate-300'}`;
        thumb.setAttribute('data-idx', idx);
        thumb.onmouseenter = () => playSfx('hover');
        thumb.onclick = () => {
          currentIndex = idx;
          isFlipped = false;
          document.getElementById('slideCardInner').classList.remove('slide-card-flipped');
          playSfx('slide');
          triggerHaptic('light');
          renderMainStage();
        };

        thumb.innerHTML = `
          <div class="flex items-center justify-between text-[11px] font-black mb-1">
            <span class="flex items-center gap-1">
              <span>${sim.emoji}</span>
              <span class="px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800">#${sim.id < 10 ? '0' + sim.id : sim.id}</span>
            </span>
            <span class="text-slate-400 font-bold truncate max-w-[90px]">${sim.categoryName}</span>
          </div>
          <p class="text-xs font-bold text-slate-800 dark:text-slate-200 line-clamp-2 leading-snug">
            ${sim.title}
          </p>
        `;

        strip.appendChild(thumb);
      });
    }

    // 更新縮圖當前選取高亮並滾動置中
    function updateThumbnailSelection() {
      document.querySelectorAll('.thumbnail-item').forEach((el, idx) => {
        if (idx === currentIndex) {
          el.className = 'thumbnail-item shrink-0 w-44 sm:w-52 p-2.5 rounded-2xl border-2 cursor-pointer transition-all duration-200 border-emerald-600 bg-emerald-50/90 dark:bg-emerald-950/60 shadow-md scale-[1.02] opacity-100';
          el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        } else {
          el.className = 'thumbnail-item shrink-0 w-44 sm:w-52 p-2.5 rounded-2xl border-2 cursor-pointer transition-all duration-200 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 opacity-75 hover:opacity-100 hover:border-slate-300';
        }
      });
    }

    // 渲染網格模式
    function renderGridCards() {
      const container = document.getElementById('gridCardsContainer');
      container.innerHTML = '';

      filteredSims.forEach((sim) => {
        const cardEl = document.createElement('div');
        cardEl.className = 'p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-lg flex flex-col justify-between space-y-4 hover:border-emerald-400 transition';
        cardEl.onmouseenter = () => playSfx('hover');

        cardEl.innerHTML = `
          <div>
            <div class="flex items-center justify-between gap-2 mb-3">
              <span class="flex items-center gap-1.5">
                <span class="text-lg">${sim.emoji}</span>
                <span class="px-3 py-1 text-xs font-black rounded-lg border bg-emerald-50 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800">
                  ${sim.categoryName} #${sim.id < 10 ? '0' + sim.id : sim.id}
                </span>
              </span>
              <span class="text-xs text-slate-400 font-bold">${sim.tag}</span>
            </div>
            <h3 class="text-lg font-black text-slate-900 dark:text-white leading-snug mb-2">
              ${sim.title}
            </h3>
            <p class="text-sm text-slate-600 dark:text-slate-400 leading-relaxed line-clamp-3">
              ${sim.desc}
            </p>
          </div>

          <div class="pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
            <button onclick="switchToSlideById(${sim.id})" class="text-sm font-black text-emerald-600 dark:text-emerald-400 hover:underline flex items-center gap-1">
              進入簡報舞台 ➔
            </button>
          </div>
        `;
        container.appendChild(cardEl);
      });
    }

    function switchToSlideById(id) {
      const idx = filteredSims.findIndex(s => s.id === id);
      if (idx !== -1) {
        currentIndex = idx;
        toggleViewMode('presentation');
        renderMainStage();
      }
    }

    // 模式切換
    function toggleViewMode(targetMode) {
      viewMode = targetMode || (viewMode === 'presentation' ? 'grid' : 'presentation');
      const presView = document.getElementById('presentationView');
      const gridV = document.getElementById('gridView');
      const modeText = document.getElementById('viewModeText');
      const modeIcon = document.getElementById('viewModeIcon');

      if (viewMode === 'presentation') {
        presView.classList.remove('hidden');
        gridV.classList.add('hidden');
        modeText.innerText = '全覽網格';
        modeIcon.setAttribute('data-lucide', 'grid');
        renderMainStage();
      } else {
        presView.classList.add('hidden');
        gridV.classList.remove('hidden');
        modeText.innerText = '簡報模式';
        modeIcon.setAttribute('data-lucide', 'presentation');
        renderGridCards();
      }
      lucide.createIcons();
    }

    document.getElementById('btnViewMode').addEventListener('click', () => {
      playSfx('slide');
      toggleViewMode();
    });

    // 鍵盤左右鍵切換簡報
    window.addEventListener('keydown', (e) => {
      if (viewMode !== 'presentation') return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown') {
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevSlide();
      } else if (e.key === ' ' || e.key === 'Enter') {
        toggleSlideFlip();
      }
    });

    // 分類篩選
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.classList.remove('active', 'bg-emerald-600', 'text-white', 'shadow-sm');
          b.classList.add('bg-slate-200/80', 'dark:bg-slate-800', 'text-slate-700', 'dark:text-slate-300');
        });
        btn.classList.add('active', 'bg-emerald-600', 'text-white', 'shadow-sm');
        btn.classList.remove('bg-slate-200/80', 'dark:bg-slate-800', 'text-slate-700', 'dark:text-slate-300');

        currentCategory = btn.getAttribute('data-category');
        filteredSims = currentCategory === 'all' ? [...simData] : simData.filter(s => s.category === currentCategory);
        currentIndex = 0;
        isFlipped = false;
        
        playSfx('slide');
        triggerHaptic('light');
        renderMainStage();
        renderThumbnails();
        if (viewMode === 'grid') renderGridCards();
      });
    });

    // 亮色/暗色主題切換 (預設亮色)
    const themeBtn = document.getElementById('btnThemeToggle');
    themeBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      playSfx('flip');
    });

    // 音效開關
    document.getElementById('btnSoundToggle').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundText').innerText = soundEnabled ? '音效已開' : '音效靜音';
      const icon = document.getElementById('soundIcon');
      if (soundEnabled) {
        icon.setAttribute('data-lucide', 'volume-2');
        playSfx('flip');
      } else {
        icon.setAttribute('data-lucide', 'volume-x');
      }
      lucide.createIcons();
    });

    // Toast 提示
    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMessage');
      toastMsg.innerText = msg;
      toast.classList.remove('hidden');
      toast.classList.add('toast-slide');
      
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('hidden');
      }, 2500);
    }

    // 頁面初次加載
    window.addEventListener('DOMContentLoaded', () => {
      renderMainStage();
      renderThumbnails();
    });
  </script>
</body>
</html>

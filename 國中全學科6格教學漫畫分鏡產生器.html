    function initAudio() {

      }

      if (!soundEnabled) return;
      try {
        initAudio();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;

        if (type === 'hover') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(580, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.05);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.05);
        } 
        else if (type === 'flip') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(920, now + 0.09);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.09);

          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);

          osc1.type = 'sine';

      textArea.style.position = "fixed";
      textArea.style.opacity = "0";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
        playSfx('copy');
        triggerHaptic('success');
        showToast('已複製提示詞！已為您開啟 Gemini，請直接貼上');

            <span class="text-slate-400 font-bold truncate max-w-[90px]">${comic.categoryName}</span>
          </div>
          <p class="text-xs font-bold text-slate-800 dark:text-slate-200 line-clamp-2 leading-snug">
            ${comic.title}
          </p>
        `;

        strip.appendChild(thumb);
      });
    }

    // 更新縮圖當前選取高亮並滾動置中
    function updateThumbnailSelection() {
      document.querySelectorAll('.thumbnail-item').forEach((el, idx) => {
        if (idx === currentIndex) {
          el.className = 'thumbnail-item shrink-0 w-44 sm:w-52 p-2.5 rounded-2xl border-2 cursor-pointer transition-all duration-200 border-pink-600 bg-pink-50/90 dark:bg-pink-950/60 shadow-md scale-[1.02] opacity-100';
          el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        } else {
          el.className = 'thumbnail-item shrink-0 w-44 sm:w-52 p-2.5 rounded-2xl border-2 cursor-pointer transition-all duration-200 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 opacity-75 hover:opacity-100 hover:border-slate-300';
        }
      });
    }

    // 渲染網格模式
    function renderGridCards() {
      const container = document.getElementById('gridCardsContainer');
      container.innerHTML = '';

      filteredComics.forEach((comic) => {
        const cardEl = document.createElement('div');
        cardEl.className = 'p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-lg flex flex-col justify-between space-y-4 hover:border-pink-400 transition';
        cardEl.onmouseenter = () => playSfx('hover');

        cardEl.innerHTML = `
          <div>
            <div class="flex items-center justify-between gap-2 mb-3">
              <span class="flex items-center gap-1.5">
                <span class="text-lg">${comic.emoji}</span>
                <span class="px-3 py-1 text-xs font-black rounded-lg border bg-pink-50 text-pink-700 dark:bg-pink-950/60 dark:text-pink-300 border-pink-200 dark:border-pink-800">
                  ${comic.categoryName} #${comic.id < 10 ? '0' + comic.id : comic.id}
                </span>
              </span>
              <span class="text-xs text-slate-400 font-bold">${comic.tag}</span>
            </div>
            <h3 class="text-lg font-black text-slate-900 dark:text-white leading-snug mb-2">
              ${comic.title}
            </h3>
            <p class="text-sm text-slate-600 dark:text-slate-400 leading-relaxed line-clamp-3">
              ${comic.desc}
            </p>
          </div>

          <div class="pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
            <button onclick="switchToSlideById(${comic.id})" class="text-sm font-black text-pink-600 dark:text-pink-400 hover:underline flex items-center gap-1">
              進入簡報舞台 ➔
            </button>
          </div>
        `;
        container.appendChild(cardEl);
      });
    }

    function switchToSlideById(id) {
      const idx = filteredComics.findIndex(s => s.id === id);
      if (idx !== -1) {
        currentIndex = idx;
        toggleViewMode('presentation');
        renderMainStage();
      }
    }

    // 模式切換
    function toggleViewMode(targetMode) {
      viewMode = targetMode || (viewMode === 'presentation' ? 'grid' : 'presentation');
      const presView = document.getElementById('presentationView');
      const gridV = document.getElementById('gridView');
      const modeText = document.getElementById('viewModeText');
      const modeIcon = document.getElementById('viewModeIcon');

      if (viewMode === 'presentation') {
        presView.classList.remove('hidden');
        gridV.classList.add('hidden');
        modeText.innerText = '全覽網格';
        modeIcon.setAttribute('data-lucide', 'grid');
        renderMainStage();
      } else {
        presView.classList.add('hidden');
        gridV.classList.remove('hidden');
        modeText.innerText = '簡報模式';
        modeIcon.setAttribute('data-lucide', 'presentation');
        renderGridCards();
      }
      lucide.createIcons();
    }

    document.getElementById('btnViewMode').addEventListener('click', () => {
      playSfx('slide');
      toggleViewMode();
    });

    // 鍵盤左右鍵切換簡報
    window.addEventListener('keydown', (e) => {
      if (viewMode !== 'presentation') return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown') {
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevSlide();
      } else if (e.key === ' ' || e.key === 'Enter') {
        toggleSlideFlip();
      }
    });

    // 分類篩選
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.classList.remove('active', 'bg-pink-600', 'text-white', 'shadow-sm');
          b.classList.add('bg-slate-200/80', 'dark:bg-slate-800', 'text-slate-700', 'dark:text-slate-300');
        });
        btn.classList.add('active', 'bg-pink-600', 'text-white', 'shadow-sm');
        btn.classList.remove('bg-slate-200/80', 'dark:bg-slate-800', 'text-slate-700', 'dark:text-slate-300');

        currentCategory = btn.getAttribute('data-category');
        filteredComics = currentCategory === 'all' ? [...comicData] : comicData.filter(s => s.category === currentCategory);
        currentIndex = 0;
        isFlipped = false;
        
        playSfx('slide');
        triggerHaptic('light');
        renderMainStage();
        renderThumbnails();
        if (viewMode === 'grid') renderGridCards();
      });
    });

    // 亮色/暗色主題切換 (預設亮色)
    const themeBtn = document.getElementById('btnThemeToggle');
    themeBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      playSfx('flip');
    });

    // 音效開關
    document.getElementById('btnSoundToggle').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      const icon = document.getElementById('soundIcon');
      if (soundEnabled) {
        icon.setAttribute('data-lucide', 'volume-2');
        playSfx('flip');
      } else {
        icon.setAttribute('data-lucide', 'volume-x');
      }
      lucide.createIcons();
    });

    // Toast 提示
    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMessage');
      toastMsg.innerText = msg;
      toast.classList.remove('hidden');
      toast.classList.add('toast-slide');
      
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('hidden');
      }, 2500);
    }

    // 頁面初次加載
    window.addEventListener('DOMContentLoaded', () => {
      renderMainStage();
      renderThumbnails();
    });
  </script>
</body>
</html>

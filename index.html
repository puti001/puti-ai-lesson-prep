<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Puti-AI | 現場互動投票：AI 時代的學習與載具管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- MQTT.js (全球標準 Pub/Sub 跨網即時通訊，100% 穿透手機與電腦) -->
  <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>

  <style>
    :root {
      --color-a: #E07A5F; /* 莫蘭迪磚紅 */
      --color-b: #81B29A; /* 鼠尾草綠 */
      --color-c: #F2CC8F; /* 暖杏黃 */
      --color-d: #3D405B; /* 柔和深靛青 */
      --bg-main: #F9F6F0;
      --bg-card: #FFFFFF;
      --text-main: #2D2724;
      --text-muted: #7A726C;
      --accent-brown: #7C4D25;
      --accent-gold: #D4A373;
      --shadow-sm: 0 4px 12px rgba(0,0,0,0.05);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
      --shadow-lg: 0 16px 36px rgba(0,0,0,0.12);
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 28px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* 頂部導航列 */
    header {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid #EBE5DC;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--accent-brown), var(--accent-gold));
      color: #fff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 10px rgba(124, 77, 37, 0.25);
    }

    .brand-title h1 {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .brand-title p {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tag-badge {
      background: #EFE9E1;
      color: var(--accent-brown);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-role-switch {
      background: var(--text-main);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-role-switch:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    /* 主舞台容器 */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 1300px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      gap: 20px;
    }

    /* 題目選單導航 */
    .q-nav {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .q-tab-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid #D8CFC4;
      background: #FFF;
      color: var(--text-main);
      font-size: 1.15rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .q-tab-btn.active {
      border-color: var(--accent-gold);
      background: #FFFDF9;
      color: var(--accent-brown);
      transform: scale(1.15);
      box-shadow: 0 0 0 4px rgba(212, 163, 115, 0.25);
    }

    .q-tab-btn.revealed::after {
      content: '✓';
      position: absolute;
      top: -2px;
      right: -2px;
      background: var(--color-b);
      color: #fff;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
    }

    /* 題目卡片 */
    .question-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 28px 36px;
      box-shadow: var(--shadow-md);
      border: 2px solid #EBE5DC;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    .q-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .q-badge {
      background: var(--accent-brown);
      color: #FFF;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 900;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }

    .q-count {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .q-title {
      font-size: 1.85rem;
      font-weight: 900;
      line-height: 1.4;
      color: var(--text-main);
    }

    .q-desc {
      font-size: 1.1rem;
      color: #635A53;
      line-height: 1.6;
      font-weight: 500;
    }

    /* 四宮格選項網格 */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      margin-top: 8px;
    }

    .option-card {
      border-radius: var(--radius-md);
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 140px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow-sm);
      border: 3px solid transparent;
    }

    .option-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    .option-card.card-A { background: rgba(224, 122, 95, 0.12); border-color: rgba(224, 122, 95, 0.3); }
    .option-card.card-B { background: rgba(129, 178, 154, 0.15); border-color: rgba(129, 178, 154, 0.35); }
    .option-card.card-C { background: rgba(242, 204, 143, 0.2); border-color: rgba(242, 204, 143, 0.5); }
    .option-card.card-D { background: rgba(61, 64, 91, 0.1); border-color: rgba(61, 64, 91, 0.25); }

    .option-card.selected {
      border-color: #2D2724 !important;
      transform: scale(1.02);
      box-shadow: var(--shadow-lg);
    }

    .opt-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      position: relative;
      z-index: 2;
    }

    .opt-key {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.3rem;
    }
    .card-A .opt-key { background: var(--color-a); }
    .card-B .opt-key { background: var(--color-b); }
    .card-C .opt-key { background: #E5B562; }
    .card-D .opt-key { background: var(--color-d); }

    .opt-text {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.45;
      color: var(--text-main);
      position: relative;
      z-index: 2;
    }

    /* 長條圖票數層 */
    .vote-bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: rgba(255,255,255,0.65);
      transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1;
    }

    .vote-stat {
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--text-main);
      display: none;
      z-index: 2;
    }

    .revealed .vote-stat {
      display: block;
    }

    /* 大螢幕主控按鈕列 */
    .host-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FFF;
      padding: 16px 28px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 2px solid #EBE5DC;
      flex-wrap: wrap;
      gap: 12px;
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-action {
      padding: 12px 24px;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 900;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-reveal {
      background: linear-gradient(135deg, var(--accent-brown), #9C6638);
      color: #FFF;
      box-shadow: 0 4px 12px rgba(124, 77, 37, 0.25);
    }
    .btn-reveal:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(124, 77, 37, 0.35);
    }

    .btn-reset {
      background: #EFE9E1;
      color: var(--text-main);
    }
    .btn-reset:hover {
      background: #E2D9CE;
    }

    .btn-qr-show {
      background: #F4ECE1;
      color: var(--accent-brown);
      border: 2px solid #D8CFC4;
    }

    .vote-summary-badge {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--accent-brown);
      background: #F7F1E8;
      padding: 8px 18px;
      border-radius: 30px;
    }

    /* 知識解析揭曉卡片 */
    .analysis-card {
      background: linear-gradient(135deg, #FFFDF9, #F8F3EA);
      border-radius: var(--radius-lg);
      border: 2px solid var(--accent-gold);
      padding: 26px 32px;
      box-shadow: var(--shadow-md);
      display: none;
      animation: slideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .analysis-card.show {
      display: block;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .analysis-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      color: var(--accent-brown);
      font-size: 1.35rem;
      font-weight: 900;
    }

    .analysis-content {
      font-size: 1.15rem;
      line-height: 1.7;
      color: #3B332E;
      font-weight: 700;
    }

    .antidote-badge {
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent-brown);
      color: #FFF;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 900;
    }

    /* QR Code 放大燈箱 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(45, 39, 36, 0.75);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: #FFF;
      padding: 36px 40px;
      border-radius: var(--radius-lg);
      max-width: 480px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      box-shadow: var(--shadow-lg);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 18px;
      background: #EFE9E1;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      color: var(--text-main);
    }

    .qr-container {
      background: #FFF;
      padding: 16px;
      border-radius: 16px;
      border: 3px solid #EBE5DC;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 手機純淨作答端樣式 */
    .player-view {
      display: none;
      flex-direction: column;
      gap: 16px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    .player-hero {
      background: #FFF;
      border-radius: var(--radius-md);
      padding: 20px;
      text-align: center;
      border: 2px solid #EBE5DC;
      box-shadow: var(--shadow-sm);
    }

    .player-options {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn-player-opt {
      border: none;
      border-radius: var(--radius-md);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: inherit;
      font-size: 1.25rem;
      font-weight: 900;
      color: #FFF;
      cursor: pointer;
      box-shadow: var(--shadow-md);
      transition: all 0.2s;
    }
    .btn-player-opt:active {
      transform: scale(0.97);
    }
    .btn-player-opt.opt-A { background: linear-gradient(135deg, #E07A5F, #C9654B); }
    .btn-player-opt.opt-B { background: linear-gradient(135deg, #81B29A, #679E84); }
    .btn-player-opt.opt-C { background: linear-gradient(135deg, #E5B562, #D49D42); }
    .btn-player-opt.opt-D { background: linear-gradient(135deg, #3D405B, #2C2E43); }

    .btn-player-opt.active {
      outline: 4px solid #2D2724;
      transform: scale(1.02);
    }

    .player-status-card {
      background: #FFFDF9;
      border: 2px dashed var(--accent-gold);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
      font-weight: 700;
      color: var(--accent-brown);
    }

    /* 頁尾版權宣告 */
    footer {
      background: #F2ECE1;
      border-top: 1px solid #E0D7C8;
      padding: 16px 20px;
      text-align: center;
      font-size: 0.85rem;
      color: #6B625B;
      line-height: 1.6;
      margin-top: auto;
    }

    footer a {
      color: var(--accent-brown);
      font-weight: 700;
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      header { padding: 10px 16px; }
      .brand-title h1 { font-size: 1rem; }
      .options-grid { grid-template-columns: 1fr; }
      .q-title { font-size: 1.35rem; }
      .q-desc { font-size: 1rem; }
      .option-card { min-height: 100px; padding: 16px; }
      .opt-text { font-size: 1.1rem; }
      .host-controls { flex-direction: column; align-items: stretch; }
      .ctrl-group { justify-content: space-between; }
    }
  </style>
</head>
<body>

  <!-- 頂部導航 -->
  <header>
    <div class="brand" onclick="handleBrandClick()">
      <div class="brand-logo">
        <i class="fa-solid fa-bolt"></i>
      </div>
      <div class="brand-title">
        <h1>Puti-AI | 現場互動即時票選系統</h1>
        <p id="subHeaderTitle">屏東縣惠農國小親職講座專用</p>
      </div>
    </div>
    <div class="header-actions">
      <span class="tag-badge" id="roleBadge"><i class="fa-solid fa-tv"></i> 大螢幕主控端</span>
      <button class="btn-role-switch" onclick="toggleRole()"><i class="fa-solid fa-mobile-screen"></i> 切換手機作答端</button>
    </div>
  </header>

  <!-- 主舞台 -->
  <main>
    
    <!-- 大螢幕主控端視圖 (Host View) -->
    <div id="hostView" style="display: flex; flex-direction: column; gap: 18px;">
      
      <!-- 題號切換導航 -->
      <div class="q-nav" id="qNav"></div>

      <!-- 題目大卡片 -->
      <div class="question-card" id="qCard">
        <div class="q-meta">
          <span class="q-badge" id="qBadge">第 1 題</span>
          <span class="q-count" id="voterCount"><i class="fa-solid fa-users"></i> 已投票：<b id="voteTotalNum">0</b> 人</span>
        </div>
        <h2 class="q-title" id="qTitle">題目載入中...</h2>
        <p class="q-desc" id="qDesc"></p>

        <!-- 四宮格選項 -->
        <div class="options-grid" id="optionsGrid"></div>
      </div>

      <!-- 主控列按鈕 -->
      <div class="host-controls">
        <div class="ctrl-group">
          <button class="btn-action btn-reveal" id="btnReveal" onclick="toggleReveal()">
            <i class="fa-solid fa-chart-column"></i> <span id="btnRevealText">立即開票揭曉</span>
          </button>
          <button class="btn-action btn-reset" onclick="resetCurrentVotes()">
            <i class="fa-solid fa-rotate-right"></i> 重置本題票數
          </button>
        </div>
        <div class="ctrl-group">
          <button class="btn-action btn-qr-show" onclick="showQrModal()">
            <i class="fa-solid fa-qrcode"></i> 放大作答 QR Code
          </button>
          <div class="vote-summary-badge" id="stateSummary">作答中</div>
        </div>
      </div>

      <!-- 知識解析與人間解藥 -->
      <div class="analysis-card" id="analysisCard">
        <div class="analysis-header">
          <i class="fa-solid fa-lightbulb"></i>
          <span id="analysisTitle">菩提老師深度解析</span>
        </div>
        <div class="analysis-content" id="analysisContent"></div>
        <div>
          <span class="antidote-badge" id="antidoteBadge"><i class="fa-solid fa-quote-left"></i> 今晚家長心法</span>
        </div>
      </div>

    </div>

    <!-- 手機作答端視圖 (Player View - 嚴格跟隨主控大螢幕控屏) -->
    <div id="playerView" class="player-view">
      <!-- 狀態同步指示條 -->
      <div style="display: flex; align-items: center; justify-content: space-between; background: #FFF; border: 1.5px solid var(--accent-gold); border-radius: 30px; padding: 8px 18px; margin-bottom: 8px; font-size: 0.88rem; color: var(--accent-brown); font-weight: 700; box-shadow: var(--shadow-sm);">
        <span><i class="fa-solid fa-satellite-dish" style="color: var(--color-b);"></i> 講師大螢幕連線中</span>
        <span id="playerSyncStatus" style="color: var(--color-b); font-weight: 900;"><i class="fa-solid fa-circle-dot"></i> 即時同步</span>
      </div>

      <div class="player-hero">
        <span class="q-badge" id="pBadge" style="margin-bottom:8px; display:inline-block;">第 1 題</span>
        <h3 id="pTitle" style="font-size:1.35rem; font-weight:900; margin-bottom:6px;">題目載入中</h3>
        <p id="pDesc" style="color:var(--text-muted); font-size:0.95rem; font-weight:500;"></p>
      </div>

      <div class="player-options" id="playerOptions"></div>

      <div class="player-status-card" id="playerStatus" style="margin-top: 14px;">
        <i class="fa-solid fa-hand-pointer"></i> 請點選上方選項完成投票（講師開票前可隨時修改）
      </div>
    </div>

  </main>

  <!-- QR Code 放大燈箱 Modal -->
  <div class="modal-overlay" id="qrModal" onclick="closeQrModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeQrModal()">&times;</button>
      <h3 style="font-size:1.4rem; font-weight:900; color:var(--accent-brown); margin-bottom: 4px;">
        <i class="fa-solid fa-mobile-screen"></i> 手機掃描立即作答
      </h3>
      <p style="color:var(--text-muted); font-weight:700; margin-bottom: 10px;">免下載、免登入，即時連線大螢幕</p>
      
      <!-- 燈箱內題號切換鈕（讓講師可在燈箱中快速切換題目 QR Code） -->
      <div class="q-nav" id="qrModalNav" style="margin-bottom: 12px;"></div>
      <div id="qrModalBadge" style="display:inline-block; font-size:0.95rem; font-weight:900; background:rgba(224, 122, 95, 0.15); color:var(--color-a); padding:4px 14px; border-radius:20px; margin-bottom:10px;">
        第 1 題專屬掃描碼
      </div>

      <div class="qr-container" id="qrCodeBig"></div>
      <p style="font-size:0.85rem; color:#888; font-weight:500; margin-top: 8px;">或在手機網址輸入：<br><b id="qrUrlText" style="color:var(--text-main); word-break:break-all;"></b></p>
    </div>
  </div>

  <!-- 版權宣告區 -->
  <footer>
    屏東縣後庄國小黃朝榮老師作品，免費分享，歡迎擴散推廣，嚴禁商用與任何侵權、不尊重著作權的行為，更多 Puti-AI 教學工具 <a href="https://padlet.com/clongwh/puti_ai_tools" target="_blank">點此前往</a>
  </footer>

  <script>
    // 題庫資料（依據今日定稿大綱精準設計）
    const QUESTIONS = [
      {
        id: 1,
        badge: "開場暖身 Q1",
        title: "請問各位爸爸媽媽，過去一週您平均每天使用手機大約多久？",
        desc: "請誠實點選最接近您的真實狀況，看看全場大人的平均數據！",
        options: [
          { key: "A", text: "1 小時以下（我超克制）", votes: 0 },
          { key: "B", text: "1 ～ 3 小時（處理工作與LINE）", votes: 0 },
          { key: "C", text: "3 ～ 5 小時（不知不覺滑很久）", votes: 0 },
          { key: "D", text: "5 小時以上（不敢算，直接投降）😅", votes: 0 }
        ],
        analysis: "大家看看大螢幕！現場很多大人每天手機也用了好幾小時。<br>我們大人下班累了都忍不住想滑手機放鬆，這就是為什麼今天<b>不是來檢討誰愛滑手機</b>，而是我們先同理：科技與演算法本來就是設計來吸引注意力的！",
        antidote: "大人也需要喘口氣，以身作則建立客廳無螢幕時段，比單向打罵更有用。"
      },
      {
        id: 2,
        badge: "客廳現況 Q2",
        title: "請問你的孩子昨天在家，大概使用手機或平板多久？",
        desc: "從放學接回家到上床睡覺，孩子接觸螢幕的總時間大概是？",
        options: [
          { key: "A", text: "沒在用（完全沒接觸手機平板）", votes: 0 },
          { key: "B", text: "3 小時以下（有節制地使用）", votes: 0 },
          { key: "C", text: "3 小時以上（放學回家都在用）", votes: 0 },
          { key: "D", text: "不確定（沒注意過或在房間用）", votes: 0 }
        ],
        analysis: "我們自己滑幾小時很清楚，但孩子在房間滑幾小時卻常常是個『黑洞』。<br>在安親班有老師盯著，<b>真正決定孩子專注力的分水嶺其實在『家裡客廳』！</b>",
        antidote: "客廳公開使用、睡前收手機，守住客廳第一道防線。"
      },
      {
        id: 3,
        badge: "科技認知 Q3",
        title: "請問你對目前最紅的「生成式 AI」了解程度如何？",
        desc: "AI 常常出現在新聞中，你平常的生活或工作有接觸過嗎？",
        options: [
          { key: "A", text: "完全不知道 AI 是什麼", votes: 0 },
          { key: "B", text: "聽過名字，但不知道能幹嘛", votes: 0 },
          { key: "C", text: "知道一點，偶爾試著問問看", votes: 0 },
          { key: "D", text: "很熟悉，工作或日常經常使用", votes: 0 }
        ],
        analysis: "現場大多數家長對 AI 還很陌生，這很正常！<br>但教育部今年已經投入 <b>117.5 億元啟動 AI 人才方舟計畫</b>，國小就要全面導入 AI 助教與家教。孩子學新科技比我們想像得快十倍，我們不用懂程式，但要知道怎麼引導！",
        antidote: "AI 不是選擇題，而是孩子未來必備的協作農具。"
      },
      {
        id: 4,
        badge: "關鍵真相 Q4",
        title: "你認為你的孩子，有沒有用過 AI 幫忙寫作業或查功課？",
        desc: "包含拍照解題、寫作文心得、查自然社會科問題等……",
        options: [
          { key: "A", text: "絕對沒有，他還不會用", votes: 0 },
          { key: "B", text: "不知道，沒有特別注意過", votes: 0 },
          { key: "C", text: "有，但我有在旁邊引導討論", votes: 0 },
          { key: "D", text: "有，而且我很擔心他變依賴抄答案", votes: 0 }
        ],
        analysis: "<b>【親子天下 2026 全國最新調查震撼揭曉】</b><br>1. 學生自稱有思考，但老師觀察到<b>「整段外包給 AI 抄答案」的比例高出近 6 倍！</b><br>2. 高達 <b>27.7% 的孩子把 AI 當成『情感樹洞』</b>說心事！<br>3. CEPR 2.7 萬人研究：靠 AI 抄作業成績看似變高，但<b>六個月後實體考試暴跌 20%！</b>",
        antidote: "答案可以借，思考不能外包！想過才能問，問了要說回來。"
      }
    ];

    // 專屬公共 MQTT WebSocket 頻道（使用全球最大免費公開 MQTT Broker: broker.emqx.io）
    const MQTT_BROKER = 'wss://broker.emqx.io:8084/mqtt';
    const TOPIC_VOTE = 'puti/huinong/20261003/vote';
    const TOPIC_STATE = 'puti/huinong/20261003/state';

    // 本地跨標籤廣播頻道（作為本地備用通道）
    const channel = new BroadcastChannel('puti_kahoot_channel');

    let currentQIndex = 0;
    let isRevealed = false;
    let currentRole = 'host'; // 'host' | 'player'
    let myChoices = {}; // 記錄已投的題目與選項 { 0: 'A', 1: 'B', ... }
    let brandClickCount = 0;
    let mqttClient = null;
    let heartbeatTimer = null;

    // 初始化讀取網址參數
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const roleParam = urlParams.get('role');
      const qParam = parseInt(urlParams.get('q'), 10);

      // 讀取本地作答記錄
      try {
        const saved = sessionStorage.getItem('puti_parent_choices');
        if (saved) myChoices = JSON.parse(saved);
      } catch(e) {}

      if (roleParam === 'player') {
        setRole('player');
        // 手機端若掃描帶有題號的條碼，先作為初始題號，但連線後一律以主控端即時狀態為準
        if (!isNaN(qParam) && qParam >= 1 && qParam <= QUESTIONS.length) {
          currentQIndex = qParam - 1;
        }
      } else {
        setRole('host');
        if (!isNaN(qParam) && qParam >= 1 && qParam <= QUESTIONS.length) {
          currentQIndex = qParam - 1;
        }
      }

      renderNav();
      renderQuestion();
      setupQrCode(currentQIndex);
      initMqtt();

      // 本地同主機跨標籤廣播接收
      channel.onmessage = (event) => {
        const data = event.data;
        if (data.type === 'VOTE_SUBMIT') {
          handleIncomingVote(data.qIndex, data.choice);
        } else if (data.type === 'STATE_CHANGE') {
          // 學生端一律嚴格服從主控端廣播
          currentQIndex = data.qIndex;
          isRevealed = data.isRevealed;
          renderNav();
          renderQuestion();
          setupQrCode(currentQIndex);
        }
      };
    });

    // 初始化 MQTT 雲端即時長連線
    function initMqtt() {
      const clientId = 'client_' + Math.random().toString(16).substr(2, 8);
      console.log('正在連線 MQTT 雲端中繼站...', MQTT_BROKER);

      mqttClient = mqtt.connect(MQTT_BROKER, {
        clientId: clientId,
        clean: true,
        connectTimeout: 5000,
        reconnectPeriod: 2000
      });

      mqttClient.on('connect', () => {
        console.log('✅ MQTT 雲端長連線成功！');
        if (currentRole === 'player') {
          const syncEl = document.getElementById('playerSyncStatus');
          if (syncEl) syncEl.innerHTML = '<i class="fa-solid fa-circle-check"></i> 即時連線中';
          mqttClient.subscribe(TOPIC_STATE);
        } else {
          mqttClient.subscribe(TOPIC_VOTE);
          broadcastState(); // 主持人連線時主動發送保留訊息

          // 講師端啟動 3 秒心跳廣播，確保任何網路抖動或剛進場的手機瞬間同步
          if (!heartbeatTimer) {
            heartbeatTimer = setInterval(() => {
              if (currentRole === 'host') broadcastState();
            }, 3000);
          }
        }
      });

      mqttClient.on('message', (topic, message) => {
        try {
          const data = JSON.parse(message.toString());
          if (topic === TOPIC_VOTE) {
            console.log('📥 收到手機雲端投票:', data);
            handleIncomingVote(data.qIndex, data.choice);
          } else if (topic === TOPIC_STATE && currentRole === 'player') {
            // 🔥 學生/家長端：嚴格強制跟隨主控端當前題號與開票狀態！
            console.log('📡 收到主控端同步指令:', data);
            currentQIndex = data.qIndex;
            isRevealed = data.isRevealed;
            renderQuestion();
          }
        } catch(e) {}
      });

      mqttClient.on('error', (err) => {
        console.warn('MQTT 連線異常:', err);
      });
    }

    // 處理收到的投票資料
    function handleIncomingVote(qIdx, choice) {
      if (QUESTIONS[qIdx]) {
        const opt = QUESTIONS[qIdx].options.find(o => o.key === choice);
        if (opt) {
          opt.votes++;
          if (currentRole === 'host') updateHostStats();
        }
      }
    }

    // 角色切換
    function toggleRole() {
      const targetRole = currentRole === 'host' ? 'player' : 'host';
      setRole(targetRole);
    }

    function setRole(role) {
      currentRole = role;
      const hostView = document.getElementById('hostView');
      const playerView = document.getElementById('playerView');
      const roleBadge = document.getElementById('roleBadge');
      const btnSwitch = document.querySelector('.btn-role-switch');

      if (role === 'host') {
        hostView.style.display = 'flex';
        playerView.style.display = 'none';
        roleBadge.style.display = 'inline-flex';
        btnSwitch.style.display = 'inline-flex';
        roleBadge.innerHTML = '<i class="fa-solid fa-tv"></i> 大螢幕主控端';
        btnSwitch.innerHTML = '<i class="fa-solid fa-mobile-screen"></i> 切換手機端';
      } else {
        hostView.style.display = 'none';
        playerView.style.display = 'flex';
        roleBadge.style.display = 'none';
        btnSwitch.style.display = 'none';
      }
      renderNav();
      renderQuestion();
      setupQrCode(currentQIndex);
    }

    // 渲染主控端與燈箱內的題號導航
    function renderNav() {
      const navElements = [
        document.getElementById('qNav'),
        document.getElementById('qrModalNav')
      ];

      navElements.forEach(navContainer => {
        if (!navContainer) return;
        navContainer.innerHTML = '';
        QUESTIONS.forEach((q, idx) => {
          const btn = document.createElement('button');
          btn.className = `q-tab-btn ${idx === currentQIndex ? 'active' : ''} ${q.revealed ? 'revealed' : ''}`;
          btn.innerText = `Q${idx + 1}`;
          btn.title = q.title;
          btn.onclick = () => switchQuestion(idx);
          navContainer.appendChild(btn);
        });
      });
    }

    // 主控端切換題目（立刻更新大螢幕、專屬 QR Code 並強制同步給所有學生端）
    function switchQuestion(idx) {
      currentQIndex = idx;
      isRevealed = QUESTIONS[currentQIndex].revealed || false;
      renderNav();
      renderQuestion();
      setupQrCode(currentQIndex);
      if (currentRole === 'host') {
        broadcastState();
      }
    }

    // 渲染當前題目（主控端與手機端）
    function renderQuestion() {
      const q = QUESTIONS[currentQIndex];
      
      // 大螢幕主控端更新
      const qBadge = document.getElementById('qBadge');
      const qTitle = document.getElementById('qTitle');
      const qDesc = document.getElementById('qDesc');
      if (qBadge) qBadge.innerText = q.badge;
      if (qTitle) qTitle.innerText = q.title;
      if (qDesc) qDesc.innerText = q.desc;

      const grid = document.getElementById('optionsGrid');
      const totalVotes = q.options.reduce((sum, opt) => sum + opt.votes, 0);
      const voteTotalNum = document.getElementById('voteTotalNum');
      if (voteTotalNum) voteTotalNum.innerText = totalVotes;

      if (grid) {
        grid.innerHTML = '';
        q.options.forEach(opt => {
          const card = document.createElement('div');
          card.className = `option-card card-${opt.key} ${isRevealed ? 'revealed' : ''}`;
          
          const percent = totalVotes > 0 ? Math.round((opt.votes / totalVotes) * 100) : 0;

          card.innerHTML = `
            <div class="vote-bar-fill" style="width: ${isRevealed ? percent : 0}%"></div>
            <div class="opt-header">
              <span class="opt-key">${opt.key}</span>
              <span class="vote-stat">${opt.votes} 票 (${percent}%)</span>
            </div>
            <div class="opt-text">${opt.text}</div>
          `;

          card.onclick = () => {
            if (!isRevealed && currentRole === 'host') {
              opt.votes++;
              updateHostStats();
            }
          };

          grid.appendChild(card);
        });
      }

      // 大螢幕解析卡片與按鈕狀態
      const analysisCard = document.getElementById('analysisCard');
      const btnRevealText = document.getElementById('btnRevealText');
      const stateSummary = document.getElementById('stateSummary');

      if (analysisCard && btnRevealText && stateSummary) {
        if (isRevealed) {
          analysisCard.classList.add('show');
          document.getElementById('analysisContent').innerHTML = q.analysis;
          document.getElementById('antidoteBadge').innerHTML = `<i class="fa-solid fa-quote-left"></i> 今晚家長心法：${q.antidote}`;
          btnRevealText.innerText = '隱藏開票結果';
          stateSummary.innerText = '已開票揭曉';
          stateSummary.style.color = 'var(--color-b)';
          stateSummary.style.background = '#EBF4F0';
        } else {
          analysisCard.classList.remove('show');
          btnRevealText.innerText = '立即開票揭曉';
          stateSummary.innerText = '作答收票中';
          stateSummary.style.color = 'var(--accent-brown)';
          stateSummary.style.background = '#F7F1E8';
        }
      }

      // 手機端更新（完全跟隨主控端 currentQIndex 與 isRevealed）
      const pBadge = document.getElementById('pBadge');
      const pTitle = document.getElementById('pTitle');
      const pDesc = document.getElementById('pDesc');
      if (pBadge) pBadge.innerText = q.badge;
      if (pTitle) pTitle.innerText = q.title;
      if (pDesc) pDesc.innerText = q.desc;

      const pOptionsContainer = document.getElementById('playerOptions');
      if (pOptionsContainer) {
        pOptionsContainer.innerHTML = '';
        const currentChoice = myChoices[currentQIndex];

        q.options.forEach(opt => {
          const btn = document.createElement('button');
          const isSelected = currentChoice === opt.key;
          btn.className = `btn-player-opt opt-${opt.key} ${isSelected ? 'active' : ''}`;
          
          // 若講師已開票揭曉，強制鎖定手機作答按鈕！
          if (isRevealed) {
            btn.disabled = true;
            btn.style.opacity = isSelected ? '1' : '0.45';
            btn.style.cursor = 'not-allowed';
            btn.style.pointerEvents = 'none';
          } else {
            btn.disabled = false;
            btn.style.cursor = 'pointer';
            btn.style.pointerEvents = 'auto';
            btn.onclick = () => submitPlayerVote(opt.key);
          }

          btn.innerHTML = `
            <span style="font-size:1.35rem; background:rgba(255,255,255,0.28); width:38px; height:38px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;">${opt.key}</span>
            <span style="text-align:left; flex:1;">${opt.text}</span>
            ${isSelected ? '<i class="fa-solid fa-circle-check" style="font-size:1.4rem;"></i>' : ''}
          `;
          pOptionsContainer.appendChild(btn);
        });
      }

      updatePlayerStatusMessage();
    }

    // 更新手機狀態列文字
    function updatePlayerStatusMessage() {
      const playerStatus = document.getElementById('playerStatus');
      if (!playerStatus) return;

      const currentChoice = myChoices[currentQIndex];

      if (isRevealed) {
        if (currentChoice) {
          playerStatus.innerHTML = `
            <span style="color:var(--color-a); font-size:1.05rem; font-weight:900;"><i class="fa-solid fa-lock"></i> 講師已開票！您選擇了 [${currentChoice}]，請看大螢幕解析</span>
          `;
        } else {
          playerStatus.innerHTML = `
            <span style="color:var(--color-a); font-size:1.05rem; font-weight:900;"><i class="fa-solid fa-lock"></i> 本題已開票結束，請看大螢幕解析與心法</span>
          `;
        }
      } else {
        if (currentChoice) {
          playerStatus.innerHTML = `
            <span style="color:var(--color-b); font-size:1.05rem; font-weight:900;"><i class="fa-solid fa-circle-check"></i> 本題已選擇 [${currentChoice}]（開票前可點擊選項修改）</span>
          `;
        } else {
          playerStatus.innerHTML = `
            <i class="fa-solid fa-hand-pointer"></i> 請點選上方選項投票（開票前可隨時修改）
          `;
        }
      }
    }

    // 提交手機投票
    function submitPlayerVote(choice) {
      if (isRevealed) return; // 開票後不可再投

      myChoices[currentQIndex] = choice;
      try {
        sessionStorage.setItem('puti_parent_choices', JSON.stringify(myChoices));
      } catch(e) {}

      renderQuestion();

      // 1. 🔥 透過 MQTT 雲端長連線將投票直接發布到大螢幕
      if (mqttClient && mqttClient.connected) {
        mqttClient.publish(TOPIC_VOTE, JSON.stringify({
          qIndex: currentQIndex,
          choice: choice
        }));
      }

      // 2. 本地跨標籤廣播（同台電腦分頁備用）
      channel.postMessage({
        type: 'VOTE_SUBMIT',
        qIndex: currentQIndex,
        choice: choice
      });

      // 3. 本地累加（若直接在主控端測試）
      const opt = QUESTIONS[currentQIndex].options.find(o => o.key === choice);
      if (opt && currentRole === 'host') {
        opt.votes++;
        updateHostStats();
      }
    }

    // 開票/隱藏切換
    function toggleReveal() {
      isRevealed = !isRevealed;
      QUESTIONS[currentQIndex].revealed = isRevealed;
      renderNav();
      renderQuestion();
      broadcastState();

      if (isRevealed) {
        confetti({
          particleCount: 70,
          spread: 70,
          origin: { y: 0.6 }
        });
      }
    }

    // 重置當前題目票數
    function resetCurrentVotes() {
      if (confirm(`確定要清空第 ${currentQIndex + 1} 題所有已投的票數嗎？`)) {
        QUESTIONS[currentQIndex].options.forEach(o => o.votes = 0);
        isRevealed = false;
        QUESTIONS[currentQIndex].revealed = false;
        renderNav();
        renderQuestion();
        broadcastState();
      }
    }

    // 更新大螢幕即時數據
    function updateHostStats() {
      const q = QUESTIONS[currentQIndex];
      const totalVotes = q.options.reduce((sum, opt) => sum + opt.votes, 0);
      const voteTotalNum = document.getElementById('voteTotalNum');
      if (voteTotalNum) voteTotalNum.innerText = totalVotes;

      const cards = document.querySelectorAll('#optionsGrid .option-card');
      cards.forEach((card, idx) => {
        const opt = q.options[idx];
        const percent = totalVotes > 0 ? Math.round((opt.votes / totalVotes) * 100) : 0;
        const bar = card.querySelector('.vote-bar-fill');
        const stat = card.querySelector('.vote-stat');
        if (bar && isRevealed) bar.style.width = percent + '%';
        if (stat) stat.innerText = `${opt.votes} 票 (${percent}%)`;
      });
    }

    // 廣播狀態給所有連線端（加入 retain: true 確保後進者即時同步）
    function broadcastState() {
      if (mqttClient && mqttClient.connected && currentRole === 'host') {
        mqttClient.publish(TOPIC_STATE, JSON.stringify({
          qIndex: currentQIndex,
          isRevealed: isRevealed
        }), { retain: true, qos: 1 });
      }

      channel.postMessage({
        type: 'STATE_CHANGE',
        qIndex: currentQIndex,
        isRevealed: isRevealed
      });
    }

    // 🔥 精準產生各題專屬 QR Code（支援 ?q=1, ?q=2, ?q=3, ?q=4）
    function setupQrCode(idx = currentQIndex) {
      const origin = window.location.origin;
      const pathname = window.location.pathname;
      const currentUrl = `${origin}${pathname}?role=player&q=${idx + 1}`;

      const qrTextEl = document.getElementById('qrUrlText');
      if (qrTextEl) qrTextEl.innerText = currentUrl;

      const qrBadgeEl = document.getElementById('qrModalBadge');
      if (qrBadgeEl && QUESTIONS[idx]) {
        qrBadgeEl.innerText = `第 ${idx + 1} 題專屬掃描碼：${QUESTIONS[idx].badge}`;
      }

      // 更新 modal 導航按鈕狀態
      const modalNavBtns = document.querySelectorAll('#qrModalNav .q-tab-btn');
      modalNavBtns.forEach((btn, i) => {
        btn.className = `q-tab-btn ${i === idx ? 'active' : ''}`;
      });

      const qrBox = document.getElementById('qrCodeBig');
      if (qrBox) {
        qrBox.innerHTML = '';
        new QRCode(qrBox, {
          text: currentUrl,
          width: 230,
          height: 230,
          colorDark: "#2D2724",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
      }
    }

    function showQrModal() {
      setupQrCode(currentQIndex);
      document.getElementById('qrModal').classList.add('active');
    }

    function closeQrModal() {
      document.getElementById('qrModal').classList.remove('active');
    }

    // 彩蛋：連點 3 下標題切換身份
    function handleBrandClick() {
      brandClickCount++;
      if (brandClickCount >= 3) {
        brandClickCount = 0;
        toggleRole();
      }
    }
  </script>
</body>
</html>

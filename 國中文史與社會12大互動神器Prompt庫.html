          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(920, now + 0.09);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.09);
        }
        else if (type === 'slide') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        }
        else if (type === 'copy') {
          const osc1 = audioCtx.createOscillator();
          const osc2 = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc1.type = 'sine';
          osc2.type = 'sine';
          osc1.frequency.setValueAtTime(659.25, now);
          osc2.frequency.setValueAtTime(987.77, now + 0.08);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(audioCtx.destination);
          osc1.start(now);
          osc1.stop(now + 0.08);
          osc2.start(now + 0.08);
          osc2.stop(now + 0.3);
        }
      } catch (e) {}
    }

    function triggerHaptic(type = 'light') {
      if ('vibrate' in navigator) {
        try {
          if (type === 'light') navigator.vibrate(20);
          else if (type === 'success') navigator.vibrate([25, 45, 25]);
        } catch (e) {}
      }
    }

    // 渲染中央 Canva 主舞台卡片
    function renderMainStage() {
      if (filteredItems.length === 0) return;
      const item = filteredItems[currentIndex];
      if (!item) return;

      document.getElementById('currentSlideNum').innerText = item.id < 10 ? '0' + item.id : item.id;
      document.getElementById('totalSlideNum').innerText = humanitiesData.length;

      // 正面內容渲染
      const frontEl = document.getElementById('stageFront');
      frontEl.innerHTML = `
        <div class="h-full flex flex-col justify-between">
          <!-- 頂部區 -->
          <div>
            <div class="flex items-center justify-between gap-2 mb-4">
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-500/10 to-rose-500/20 dark:bg-slate-800 flex items-center justify-center text-slate-800 dark:text-slate-100 shadow-md border border-slate-200 dark:border-slate-700 text-2xl">
                  ${item.emoji}
                </div>
                <div>
                  <span class="px-3.5 py-1 text-xs sm:text-sm font-black rounded-lg border bg-amber-50 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300 border-amber-200 dark:border-amber-800">
                    ${item.categoryName} #${item.id < 10 ? '0' + item.id : item.id}
                  </span>
                  <span class="text-xs text-slate-400 font-bold ml-2 hidden sm:inline">核心：${item.tag}</span>
                </div>
              </div>
              <div class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-amber-50 dark:bg-slate-800 text-amber-800 dark:text-amber-300 text-xs sm:text-sm font-black border border-amber-200 dark:border-slate-700 shadow-sm">
                <i data-lucide="rotate-cw" class="w-4 h-4 text-amber-600"></i>
                <span>點擊翻轉看 Prompt</span>
              </div>
            </div>

            <!-- 超大標題與動態呈現說明 -->
            <div class="space-y-4 pt-2">
              <div class="inline-flex items-center gap-1.5 text-xs sm:text-sm font-black text-amber-800 dark:text-amber-400 bg-amber-50 dark:bg-amber-950/70 px-3 py-1 rounded-lg border border-amber-200 dark:border-amber-800/50">
                <i data-lucide="sparkles" class="w-4 h-4 text-amber-500"></i>
                <span>文史與社會沉浸式互動神器</span>
              </div>

              <!-- 超大標題 (2xl ~ 4xl) -->
              <h2 class="text-2xl sm:text-3xl lg:text-4xl font-black text-slate-900 dark:text-white leading-tight tracking-tight">
                ${item.title}
              </h2>

              <!-- 詳述 (text-base ~ text-lg 大字) -->
              <p class="text-base sm:text-lg lg:text-xl text-slate-600 dark:text-slate-300 leading-relaxed font-normal pt-2">
                ${item.desc}
              </p>
            </div>
          </div>

          <!-- 底部功能亮點與引導 -->
          <div class="pt-4 mt-3 border-t border-slate-200/90 dark:border-slate-800 space-y-3">
            <div class="text-xs sm:text-sm lg:text-base font-bold text-amber-900 dark:text-amber-300 bg-amber-50 dark:bg-amber-950/60 px-4 py-3 rounded-2xl border border-amber-200 dark:border-amber-800/60 flex items-center gap-2.5">
              <span class="text-xl">💡</span>
              <span class="truncate font-black">${item.features}</span>
            </div>

            <div class="flex items-center justify-between text-xs sm:text-sm lg:text-base pt-1">
              <span class="text-slate-500 dark:text-slate-400 font-bold">適用工具：Google Gemini / Canvas / 課堂分組</span>
              <span class="font-black text-amber-600 dark:text-amber-400 flex items-center gap-1.5 group-hover:translate-x-1 transition text-sm sm:text-base">
                點擊翻轉查看完整 Prompt 指令 ➔
              </span>
            </div>
          </div>
        </div>
      `;

      // 背面內容渲染：Prompt 框 ＋ 一鍵複製 ＋ 直達 Gemini
      const backEl = document.getElementById('stageBack');
      backEl.innerHTML = `
        <div class="h-full flex flex-col justify-between">
          <div>
            <!-- 背面頂部 -->
            <div class="flex items-center justify-between gap-2 pb-2.5 border-b border-slate-800">
              <div class="flex items-center gap-2">
                <span class="text-xl">${item.emoji}</span>
                <span class="px-3 py-1 text-xs sm:text-sm font-black rounded-lg bg-amber-500/20 text-amber-300 border border-amber-400/40 uppercase tracking-wider">
                  ${item.categoryName} ｜ ${item.tag}
                </span>
              </div>
              <button onclick="toggleSlideFlip(event)" class="p-1.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition">
                <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
              </button>
            </div>

            <!-- 提示說明 -->
            <div class="py-2">
              <p class="text-xs sm:text-sm text-amber-200 leading-relaxed font-semibold bg-amber-950/80 p-3 rounded-2xl border border-amber-800/60 shadow-inner">
                ✨ 將以下提示詞複製貼給 Google Gemini，即可 10 秒產出高品質互動劇本、診斷規準、口說情境或辯論公聽會！
              </p>
            </div>
          </div>

          <!-- Prompt 框 (大字體、高對比) -->
          <div class="relative flex-1 my-1.5 bg-slate-950/90 rounded-2xl p-4 border border-slate-800 overflow-y-auto max-h-[220px] text-xs sm:text-sm font-mono text-slate-200 leading-relaxed selection:bg-amber-600 shadow-inner">
            <pre id="stage_prompt_text" class="whitespace-pre-wrap">${item.promptText}</pre>
          </div>

          <!-- 底部按鈕群：複製 ＋ 直達 Gemini -->
          <div class="pt-3 border-t border-slate-800 flex flex-wrap items-center justify-between gap-3">
            <span class="text-xs text-slate-400 font-medium hidden sm:inline">複製後至 Gemini 貼上即自動生成</span>
            <div class="flex items-center gap-2.5 w-full sm:w-auto">
              <button onclick="copyStagePrompt()" onmouseenter="playSfx('hover')" class="flex-1 sm:flex-initial px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-750 text-slate-200 border border-slate-700 font-bold text-xs sm:text-sm flex items-center justify-center gap-2 shadow transition active:scale-95">
                <i data-lucide="copy" class="w-4 h-4 text-amber-400"></i>
                <span>一鍵複製 Prompt</span>
              </button>
              <a href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer" onclick="copyPromptBeforeNavigate(event)" onmouseenter="playSfx('hover')" class="flex-1 sm:flex-initial px-5 py-2.5 rounded-xl bg-gradient-to-r from-amber-600 via-rose-600 to-indigo-600 hover:from-amber-500 hover:to-indigo-500 text-white font-black text-xs sm:text-sm flex items-center justify-center gap-2 shadow-lg shadow-amber-600/40 active:scale-95 transition">
                <i data-lucide="external-link" class="w-4 h-4 text-amber-300"></i>
                <span>🚀 直達 Gemini 實測生成</span>
              </a>
            </div>
          </div>
        </div>
      `;

      lucide.createIcons();
      updateThumbnailSelection();
    }

    // 複製主舞台 Prompt
    function copyStagePrompt() {
      const text = document.getElementById('stage_prompt_text').innerText;
      navigator.clipboard.writeText(text).then(() => {
        playSfx('copy');
        triggerHaptic('success');
        showToast('已複製文史社會提示詞！可直接至 Gemini 貼上執行');
      });
    }

    // 點擊原生 <a> 標籤直達 Gemini 前先複製提示詞
    function copyPromptBeforeNavigate(event) {
      const text = document.getElementById('stage_prompt_text').innerText;
      
      // 複製提示詞
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text);
      } else {
        fallbackCopyText(text);
      }
      playSfx('copy');
      triggerHaptic('success');
      showToast('已複製提示詞！已在新分頁開啟 Gemini');
    }

    // 備用複製方案 (相容所有瀏覽器與本機環境)
    function fallbackCopyText(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.opacity = "0";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
        playSfx('copy');
        triggerHaptic('success');
        showToast('已複製提示詞！已為您開啟 Gemini，請直接貼上');
      } catch (err) {
        showToast('已開啟 Gemini，請手動複製提示詞');
      }
      document.body.removeChild(textArea);
    }

    // 主舞台卡片翻轉
    function toggleSlideFlip(event) {
      if (event) event.stopPropagation();
      const innerCard = document.getElementById('slideCardInner');
      isFlipped = !isFlipped;
      if (isFlipped) {
        innerCard.classList.add('slide-card-flipped');
      } else {
        innerCard.classList.remove('slide-card-flipped');
      }
      playSfx('flip');
      triggerHaptic('light');
    }

    // 下一張簡報
    function nextSlide() {
      if (currentIndex < filteredItems.length - 1) {
        currentIndex++;
        isFlipped = false;
        document.getElementById('slideCardInner').classList.remove('slide-card-flipped');
        playSfx('slide');
        triggerHaptic('light');
        renderMainStage();
      }
    }

    // 上一張簡報
    function prevSlide() {
      if (currentIndex > 0) {
        currentIndex--;
        isFlipped = false;
        document.getElementById('slideCardInner').classList.remove('slide-card-flipped');
        playSfx('slide');
        triggerHaptic('light');
        renderMainStage();
      }
    }

    // 渲染底部 Canva 風格縮圖列
    function renderThumbnails() {
      const strip = document.getElementById('thumbnailStrip');
      strip.innerHTML = '';

      filteredItems.forEach((item, idx) => {
        const thumb = document.createElement('div');
        thumb.className = `thumbnail-item shrink-0 w-44 sm:w-52 p-2.5 rounded-2xl border-2 cursor-pointer transition-all duration-200 ${idx === currentIndex ? 'border-amber-600 bg-amber-50/90 dark:bg-amber-950/60 shadow-md scale-[1.02]' : 'border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 opacity-75 hover:opacity-100 hover:border-slate-300'}`;
        thumb.setAttribute('data-idx', idx);
        thumb.onmouseenter = () => playSfx('hover');
        thumb.onclick = () => {
          currentIndex = idx;
          isFlipped = false;
          document.getElementById('slideCardInner').classList.remove('slide-card-flipped');
          playSfx('slide');
          triggerHaptic('light');
          renderMainStage();
        };

        thumb.innerHTML = `
          <div class="flex items-center justify-between text-[11px] font-black mb-1">
            <span class="flex items-center gap-1">
              <span>${item.emoji}</span>
              <span class="px-1.5 py-0.5 rounded bg-amber-50 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300 border border-amber-200 dark:border-amber-800">#${item.id < 10 ? '0' + item.id : item.id}</span>
            </span>
            <span class="text-slate-400 font-bold truncate max-w-[90px]">${item.categoryName}</span>
          </div>
          <p class="text-xs font-bold text-slate-800 dark:text-slate-200 line-clamp-2 leading-snug">
            ${item.title}
          </p>
        `;

        strip.appendChild(thumb);
      });
    }

    // 更新縮圖當前選取高亮並滾動置中
    function updateThumbnailSelection() {
      document.querySelectorAll('.thumbnail-item').forEach((el, idx) => {
        if (idx === currentIndex) {
          el.className = 'thumbnail-item shrink-0 w-44 sm:w-52 p-2.5 rounded-2xl border-2 cursor-pointer transition-all duration-200 border-amber-600 bg-amber-50/90 dark:bg-amber-950/60 shadow-md scale-[1.02] opacity-100';
          el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        } else {
          el.className = 'thumbnail-item shrink-0 w-44 sm:w-52 p-2.5 rounded-2xl border-2 cursor-pointer transition-all duration-200 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 opacity-75 hover:opacity-100 hover:border-slate-300';
        }
      });
    }

    // 渲染網格模式
    function renderGridCards() {
      const container = document.getElementById('gridCardsContainer');
      container.innerHTML = '';

      filteredItems.forEach((item) => {
        const cardEl = document.createElement('div');
        cardEl.className = 'p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-lg flex flex-col justify-between space-y-4 hover:border-amber-400 transition';
        cardEl.onmouseenter = () => playSfx('hover');

        cardEl.innerHTML = `
          <div>
            <div class="flex items-center justify-between gap-2 mb-3">
              <span class="flex items-center gap-1.5">
                <span class="text-lg">${item.emoji}</span>
                <span class="px-3 py-1 text-xs font-black rounded-lg border bg-amber-50 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300 border-amber-200 dark:border-amber-800">
                  ${item.categoryName} #${item.id < 10 ? '0' + item.id : item.id}
                </span>
              </span>
              <span class="text-xs text-slate-400 font-bold">${item.tag}</span>
            </div>
            <h3 class="text-lg font-black text-slate-900 dark:text-white leading-snug mb-2">
              ${item.title}
            </h3>
            <p class="text-sm text-slate-600 dark:text-slate-400 leading-relaxed line-clamp-3">
              ${item.desc}
            </p>
          </div>

          <div class="pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
            <button onclick="switchToSlideById(${item.id})" class="text-sm font-black text-amber-600 dark:text-amber-400 hover:underline flex items-center gap-1">
              進入簡報舞台 ➔
            </button>
          </div>
        `;
        container.appendChild(cardEl);
      });
    }

    function switchToSlideById(id) {
      const idx = filteredItems.findIndex(s => s.id === id);
      if (idx !== -1) {
        currentIndex = idx;
        toggleViewMode('presentation');
        renderMainStage();
      }
    }

    // 模式切換
    function toggleViewMode(targetMode) {
      viewMode = targetMode || (viewMode === 'presentation' ? 'grid' : 'presentation');
      const presView = document.getElementById('presentationView');
      const gridV = document.getElementById('gridView');
      const modeText = document.getElementById('viewModeText');
      const modeIcon = document.getElementById('viewModeIcon');

      if (viewMode === 'presentation') {
        presView.classList.remove('hidden');
        gridV.classList.add('hidden');
        modeText.innerText = '全覽網格';
        modeIcon.setAttribute('data-lucide', 'grid');
        renderMainStage();
      } else {
        presView.classList.add('hidden');
        gridV.classList.remove('hidden');
        modeText.innerText = '簡報模式';
        modeIcon.setAttribute('data-lucide', 'presentation');
        renderGridCards();
      }
      lucide.createIcons();
    }

    document.getElementById('btnViewMode').addEventListener('click', () => {
      playSfx('slide');
      toggleViewMode();
    });

    // 鍵盤左右鍵切換簡報
    window.addEventListener('keydown', (e) => {
      if (viewMode !== 'presentation') return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown') {
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevSlide();
      } else if (e.key === ' ' || e.key === 'Enter') {
        toggleSlideFlip();
      }
    });

    // 分類篩選
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.classList.remove('active', 'bg-amber-600', 'text-white', 'shadow-sm');
          b.classList.add('bg-slate-200/80', 'dark:bg-slate-800', 'text-slate-700', 'dark:text-slate-300');
        });
        btn.classList.add('active', 'bg-amber-600', 'text-white', 'shadow-sm');
        btn.classList.remove('bg-slate-200/80', 'dark:bg-slate-800', 'text-slate-700', 'dark:text-slate-300');

        currentCategory = btn.getAttribute('data-category');
        filteredItems = currentCategory === 'all' ? [...humanitiesData] : humanitiesData.filter(s => s.category === currentCategory);
        currentIndex = 0;
        isFlipped = false;
        
        playSfx('slide');
        triggerHaptic('light');
        renderMainStage();
        renderThumbnails();
        if (viewMode === 'grid') renderGridCards();
      });
    });

    // 亮色/暗色主題切換 (預設亮色)
    const themeBtn = document.getElementById('btnThemeToggle');
    themeBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      playSfx('flip');
    });

    // 音效開關
    document.getElementById('btnSoundToggle').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundText').innerText = soundEnabled ? '音效已開' : '音效靜音';
      const icon = document.getElementById('soundIcon');
      if (soundEnabled) {
        icon.setAttribute('data-lucide', 'volume-2');
        playSfx('flip');
      } else {
        icon.setAttribute('data-lucide', 'volume-x');
      }
      lucide.createIcons();
    });

    // Toast 提示
    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMessage');
      toastMsg.innerText = msg;
      toast.classList.remove('hidden');
      toast.classList.add('toast-slide');
      
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('hidden');
      }, 2500);
    }

    // 頁面初次加載
    window.addEventListener('DOMContentLoaded', () => {
      renderMainStage();
      renderThumbnails();
    });
  </script>
</body>
</html>
